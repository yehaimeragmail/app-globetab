name: Bootstrap
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project files
        run: |
          tar xzf globetab.tar.gz
          rm globetab.tar.gz
          rm -rf android/app/src/main/kotlin/com/gameswajiha
          rm -rf .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Globe Tab project files" || echo "nothing to commit"
          git push
